services:

  app:
    build: .
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      PORT: "3000"
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/auth-page', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx:
    build: ./nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

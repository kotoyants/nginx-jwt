load_module modules/ngx_http_js_module.so;
env JWT_SECRET;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    js_import jwt from /etc/nginx/njs/jwt.js;

    resolver 127.0.0.11 valid=30s;

    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

    server {
        listen 80;
        server_name _;

        set $nodejs http://app:3000;

        location = / {
            return 302 $scheme://$http_host/auth-page;
        }

        # JWT validation runs in nginx via njs — no request to Node.js
        location = /validate {
            internal;
            js_content jwt.validate;
        }

        location = /auth-page {
            limit_req        zone=login_zone burst=5 nodelay;
            limit_req_status 429;

            proxy_pass          $nodejs;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version  1.1;
            proxy_set_header    Connection        "";
        }

        location = /login {
            limit_req        zone=login_zone burst=5 nodelay;
            limit_req_status 429;

            proxy_pass          $nodejs;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version  1.1;
            proxy_set_header    Connection        "";
        }

        location = /logout {
            proxy_pass          $nodejs;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_http_version  1.1;
            proxy_set_header    Connection        "";
        }

        location / {
            auth_request     /validate;

            auth_request_set $auth_login $upstream_http_x_user_login;
            auth_request_set $auth_name  $upstream_http_x_user_name;
            auth_request_set $auth_role  $upstream_http_x_user_role;

            proxy_pass          $nodejs;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-User-Login      $auth_login;
            proxy_set_header    X-User-Name       $auth_name;
            proxy_set_header    X-User-Role       $auth_role;

            proxy_http_version  1.1;
            proxy_set_header    Connection        "";

            error_page 401 = @auth_required;
        }

        location @auth_required {
            return 401;
        }
    }
}

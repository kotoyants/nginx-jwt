load_module /usr/lib/nginx/modules/ndk_http_module.so;
load_module /usr/lib/nginx/modules/ngx_http_lua_module.so;

env JWT_SECRET;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    lua_package_path  "/etc/nginx/lua/?.lua;;";
    lua_package_cpath "/etc/nginx/lua/?.so;;";
    lua_code_cache    on;

    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

    upstream nodejs {
        server app:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        location = / {
            return 302 $scheme://$http_host/auth-page;
        }

        location = /auth-page {
            limit_req        zone=login_zone burst=5 nodelay;
            limit_req_status 429;

            proxy_pass          http://nodejs;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version  1.1;
            proxy_set_header    Connection        "";
        }

        location = /login {
            limit_req        zone=login_zone burst=5 nodelay;
            limit_req_status 429;

            proxy_pass          http://nodejs;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version  1.1;
            proxy_set_header    Connection        "";
        }

        location = /logout {
            proxy_pass          http://nodejs;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_http_version  1.1;
            proxy_set_header    Connection        "";
        }

        location / {
            # JWT validation in access phase: validates token and injects
            # X-User-* headers into the upstream request via ngx.req.set_header
            access_by_lua_block {
                require("jwt").validate()
            }

            proxy_pass          http://nodejs;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version  1.1;
            proxy_set_header    Connection        "";

            error_page 401 = @auth_required;
        }

        location @auth_required {
            return 401;
        }
    }
}
